<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Sign In · HR Horizon</title>
<link rel="stylesheet" href="assets/css/style.css" />
</head>
<body>
  <div class="login-shell">
    <div class="login-card">
      <div class="brand" style="padding-bottom:20px">
        <div class="brand-mark">HH</div>
        <div>
          <div class="brand-name" style="color:var(--primary-dark)">HR Horizon</div>
          <div class="brand-sub" style="color:var(--muted)">Workforce OS</div>
        </div>
      </div>
      <form id="login-form">
        <div class="field" style="margin-bottom:14px"><label>Username</label><input name="username" value="admin" required /></div>
        <div class="field" style="margin-bottom:18px"><label>Password</label><input type="password" name="password" value="admin123" required /></div>
        <button type="submit" class="btn btn-accent" style="width:100%; justify-content:center">Sign In</button>
        <div id="login-error" style="color:var(--danger); font-size:12.5px; margin-top:10px"></div>
      </form>
      <div style="margin-top:16px; font-size:12px; color:var(--muted); text-align:center">Demo credentials — admin / admin123</div>
    </div>
  </div>
  <script src="assets/js/api.js"></script>
  <script>
    document.getElementById("login-form").addEventListener("submit", async (e) => {
      e.preventDefault();
      const data = Object.fromEntries(new FormData(e.target).entries());
      try {
        await api.post("/settings/login", data);
        window.location.href = "index.html";
      } catch (err) {
        document.getElementById("login-error").textContent = err.message;
      }
    });
  </script>
</body>
</html>
